name: TEST MITRA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Gradle 9.3.1 configured."

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x ./gradlew

      - name: Create required debug keystore
        shell: bash
        run: |
          set -e

          echo "Checking debug keystore..."

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "debug.keystore not found."
            echo "Creating debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          echo "Debug keystore created successfully."

      - name: Verify project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Debug keystore:"
          ls -lh debug.keystore

      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building TEST MITRA Debug APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p apk-output

          cp "$APK_FILE" \
            apk-output/TEST-MITRA-debug.apk

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

      - name: Build completed
        shell: bash
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
