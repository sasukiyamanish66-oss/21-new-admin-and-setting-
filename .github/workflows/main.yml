name: TEST MITRA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and extract ZIP if repository contains ZIP
      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/extracted"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            unzip -q -o "$ZIP_FILE" -d "$RUNNER_TEMP/extracted"

            echo "ZIP extracted successfully."

            find "$RUNNER_TEMP/extracted" -maxdepth 3 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              | head -20
          else
            echo "No ZIP found."
            echo "Using repository files directly."
          fi

      # 4. Find Android Gradle project safely
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # First check extracted ZIP
          if [ -d "$RUNNER_TEMP/extracted" ]; then

            PROJECT_DIR=$(find "$RUNNER_TEMP/extracted" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit \
              | xargs -r dirname || true)

          fi

          # If not found, search repository
          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              ! -path "*/.git/*" \
              -print -quit \
              | xargs -r dirname || true)

          fi

          # If settings.gradle is not available, search build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR=$(find "$RUNNER_TEMP/extracted" "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              ! -path "*/.git/*" \
              -print -quit \
              | xargs -r dirname || true)

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project could not be found."
            echo ""
            echo "Available files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

      # 5. Fix Gradle wrapper permissions if present
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "No gradlew found."
          fi

      # 6. Create debug keystore only if missing
      - name: Create debug keystore if missing
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Creating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else
            echo "Debug keystore already exists."
          fi

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. Verify project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""

          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            echo "gradlew is missing."
            exit 1
          fi

      # 9. Clean build
      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew clean --no-daemon

      # 10. Build Debug APK
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 11. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            | grep -E "debug.*\.apk$|\.apk$" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 12. Upload APK
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # 13. Complete
      - name: Build completed
        shell: bash
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: $APK_PATH"
