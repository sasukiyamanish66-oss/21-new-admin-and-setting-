name: TEST MITRA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Debug APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup JDK 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Find and extract ZIP
      # ---------------------------------------------------------
      - name: Find and extract project
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Finding project ZIP"
          echo "=============================="

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # ---------------------------------------------------------
      # 4. Locate Android project
      # ---------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Locating Android project"
          echo "=============================="

          PROJECT_DIR=""

          # First priority: settings.gradle / settings.gradle.kts
          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          # Second priority: build.gradle / build.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR="$(dirname "$BUILD_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      # ---------------------------------------------------------
      # 5. Fix Gradle version for AGP 9.1.1
      # ---------------------------------------------------------
      - name: Fix Gradle wrapper version
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Fixing Gradle version"
          echo "=============================="

          WRAPPER_FILE="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          mkdir -p "$PROJECT_DIR/gradle/wrapper"

          if [ -f "$WRAPPER_FILE" ]; then

            echo "Existing Gradle wrapper:"
            cat "$WRAPPER_FILE"

            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              "$WRAPPER_FILE"

          else

            echo "Gradle wrapper properties not found."
            echo "Creating Gradle 9.3.1 wrapper configuration."

            cat > "$WRAPPER_FILE" <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=100000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

          fi

          echo ""
          echo "Final Gradle wrapper:"
          cat "$WRAPPER_FILE"

      # ---------------------------------------------------------
      # 6. Ensure Gradle wrapper executable
      # ---------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found."
            echo "Generating wrapper with installed Gradle."

            gradle wrapper --gradle-version 9.3.1

            chmod +x ./gradlew
          fi

          echo "Gradle wrapper ready."

      # ---------------------------------------------------------
      # 7. Show versions
      # ---------------------------------------------------------
      - name: Verify Gradle and Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "Java version"
          echo "=============================="
          java -version

          echo ""
          echo "=============================="
          echo "Gradle version"
          echo "=============================="
          ./gradlew --version

          echo ""
          echo "=============================="
          echo "Project structure"
          echo "=============================="
          find . -maxdepth 2 -type f \
            \( -name "build.gradle*" \
            -o -name "settings.gradle*" \
            -o -name "gradle.properties" \) \
            -print

      # ---------------------------------------------------------
      # 8. Fix old Android build configuration if necessary
      # ---------------------------------------------------------
      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Android configuration..."

          if [ -f "gradle.properties" ]; then

            if ! grep -q "android.useAndroidX" gradle.properties; then
              echo "android.useAndroidX=true" >> gradle.properties
            fi

            if ! grep -q "android.enableJetifier" gradle.properties; then
              echo "android.enableJetifier=true" >> gradle.properties
            fi

          else

            cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
EOF

          fi

          echo "Android configuration checked."

      # ---------------------------------------------------------
      # 9. Clean build
      # ---------------------------------------------------------
      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean --no-daemon --stacktrace

      # ---------------------------------------------------------
      # 10. Build Debug APK
      # ---------------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "Building TEST MITRA APK"
          echo "=============================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 11. Find APK
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Searching for APK"
          echo "=============================="

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"

      # ---------------------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 13. Build completed
      # ---------------------------------------------------------
      - name: Build completed
        shell: bash
        run: |
          echo "======================================"
          echo "TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: TEST-MITRA-debug.apk"
