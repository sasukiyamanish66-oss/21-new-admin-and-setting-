name: TEST MITRA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA Debug APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. EXTRACT ZIP IF PRESENT
      # --------------------------------------------------
      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/extracted"
          mkdir -p "$RUNNER_TEMP/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            unzip -q -o "$ZIP_FILE" \
              -d "$RUNNER_TEMP/extracted"

            echo "ZIP EXTRACTION SUCCESSFUL"

          else
            echo "NO ZIP FOUND"
            echo "Repository itself will be used."
          fi


      # --------------------------------------------------
      # 4. FIND ANDROID PROJECT
      # --------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          echo "Searching extracted project..."

          if [ -d "$RUNNER_TEMP/extracted" ]; then

            PROJECT_DIR=$(find "$RUNNER_TEMP/extracted" \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print -quit \
              | xargs -r dirname || true)

          fi

          echo "First search result:"
          echo "$PROJECT_DIR"


          # If not found, search repository
          if [ -z "$PROJECT_DIR" ]; then

            echo "Searching repository..."

            PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              ! -path "*/.git/*" \
              -print -quit \
              | xargs -r dirname || true)

          fi


          # Fallback to build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            echo "Searching build.gradle..."

            PROJECT_DIR=$(find "$RUNNER_TEMP/extracted" \
              "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              ! -path "*/.git/*" \
              -print -quit \
              | xargs -r dirname || true)

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "=========================================="
            echo "ERROR: ANDROID PROJECT NOT FOUND"
            echo "=========================================="

            find "$RUNNER_TEMP/extracted" \
              -maxdepth 5 \
              -type f \
              | head -200 || true

            exit 1
          fi


          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. SHOW PROJECT
      # --------------------------------------------------
      - name: Show Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          echo "PROJECT DIRECTORY:"
          pwd

          echo ""
          echo "PROJECT FILES:"
          ls -la


      # --------------------------------------------------
      # 6. SETUP GRADLE 8.11.1
      # --------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      # --------------------------------------------------
      # 7. CREATE GRADLE WRAPPER IF MISSING
      # --------------------------------------------------
      - name: Create Gradle wrapper if missing
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          if [ -f "./gradlew" ]; then

            echo "gradlew already exists."
            chmod +x ./gradlew

          else

            echo "gradlew NOT FOUND."
            echo "Creating Gradle wrapper..."

            gradle wrapper \
              --gradle-version 8.11.1

            chmod +x ./gradlew

            echo "Gradle wrapper created successfully."

          fi


      # --------------------------------------------------
      # 8. CREATE DEBUG KEYSTORE
      # --------------------------------------------------
      - name: Create debug keystore if missing
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            echo "Creating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Debug keystore already exists."

          fi


      # --------------------------------------------------
      # 9. VERIFY GRADLE
      # --------------------------------------------------
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          chmod +x ./gradlew

          ./gradlew --version


      # --------------------------------------------------
      # 10. CLEAN
      # --------------------------------------------------
      - name: Clean build
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 11. BUILD APK
      # --------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 12. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_PATH=$(find "$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            | grep -E "debug.*\.apk$|\.apk$" \
            | head -n 1 || true)

          if [ -z "$APK_PATH" ]; then

            echo "=========================================="
            echo "ERROR: APK NOT FOUND"
            echo "=========================================="

            find "$ANDROID_PROJECT" \
              -type f \
              | grep -E "\.apk$" || true

            exit 1
          fi

          echo "=========================================="
          echo "APK FOUND"
          echo "$APK_PATH"
          echo "=========================================="

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 13. UPLOAD APK
      # --------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # --------------------------------------------------
      # 14. COMPLETE
      # --------------------------------------------------
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       TEST MITRA APK BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "$APK_PATH"
          echo ""
