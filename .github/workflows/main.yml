name: TEST MITRA APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA Debug APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout project
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Find Android project
      # ---------------------------------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1 | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "TEST MITRA"
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo "======================================"

      # ---------------------------------------------------------
      # 3. Setup JDK 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Fix build configuration only
      # ---------------------------------------------------------
      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Fixing Android build configuration..."

          # -----------------------------------------------------
          # AGP
          # -----------------------------------------------------
          if [ -f "$P/gradle/libs.versions.toml" ]; then
            sed -i 's/agp = "9\.1\.1"/agp = "8.9.2"/g' \
              "$P/gradle/libs.versions.toml"
          fi

          # -----------------------------------------------------
          # compileSdk / targetSdk
          # -----------------------------------------------------
          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' \
              "$P/app/build.gradle.kts"

            sed -i \
              's/targetSdk = 36/targetSdk = 35/g' \
              "$P/app/build.gradle.kts"

          fi

          # -----------------------------------------------------
          # AndroidX
          # -----------------------------------------------------
          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=' "$P/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=' "$P/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          # -----------------------------------------------------
          # Disable configuration cache
          # -----------------------------------------------------
          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          if ! grep -q '^org.gradle.configuration-cache=' "$P/gradle.properties"; then
            echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"
          fi

          echo "Build configuration fixed."

      # ---------------------------------------------------------
      # 5. Fix nullable testName compile issue
      #    Only changes nullable String declaration to String.
      #    No other application logic is changed.
      # ---------------------------------------------------------
      - name: Fix testName Kotlin type
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          MODEL="$P/app/src/main/java/com/example/data/model/Models.kt"

          if [ -f "$MODEL" ]; then

            # If generated/project version has nullable testName,
            # make it non-null with an empty default.
            sed -i \
              's/val testName: String? = null/val testName: String = ""/g' \
              "$MODEL"

            sed -i \
              's/val testName: String?)/val testName: String)/g' \
              "$MODEL"

            sed -i \
              's/val testName: String?,/val testName: String,/g' \
              "$MODEL"

            echo "testName type check completed."

          else
            echo "Models.kt not found. Skipping testName fix."
          fi

      # ---------------------------------------------------------
      # 6. Make debug signing reliable
      # ---------------------------------------------------------
      - name: Create debug keystore if missing
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ ! -f "$P/debug.keystore" ]; then

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$P/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else
            echo "debug.keystore already exists."
          fi

      # ---------------------------------------------------------
      # 7. Configure Supabase
      # ---------------------------------------------------------
      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" \
              "$SUPABASE_ANON_KEY" \
              > "$P/.env"

            echo "Supabase secrets configured."

          elif [ -f "$P/.env.example" ]; then

            cp "$P/.env.example" "$P/.env"

            echo "Supabase secrets not supplied."
            echo "Using .env.example."

          else

            touch "$P/.env"

            echo "No .env.example found."

          fi

      # ---------------------------------------------------------
      # 8. Setup Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ---------------------------------------------------------
      # 9. Verify project
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Project verification"
          echo "======================================"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "settings.gradle.kts: OK"
          echo "app/build.gradle.kts: OK"

      # ---------------------------------------------------------
      # 10. Clean generated build folders
      # ---------------------------------------------------------
      - name: Clean build outputs
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          echo "Build outputs cleaned."

      # ---------------------------------------------------------
      # 11. Build Debug APK
      # ---------------------------------------------------------
      - name: Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean \
            assembleDebug

      # ---------------------------------------------------------
      # 12. Find APK
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/TEST-MITRA-debug.apk"

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 14. Build success
      # ---------------------------------------------------------
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo " TEST MITRA APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK artifact:"
          echo "TEST-MITRA-APK"
          echo ""
