name: 🚀 TEST MITRA - Extract, Fix & Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 📦 TEST MITRA APK Build
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. FIND AND EXTRACT ZIP
      # =========================================================
      - name: 📂 Detect and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "🔍 SEARCHING FOR ZIP FILE"
          echo "========================================"

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then

            echo "📦 ZIP FOUND:"
            echo "$ZIP_FILE"

            rm -rf extracted_temp
            mkdir -p extracted_temp

            echo "⚡ Extracting..."

            unzip -o -q "$ZIP_FILE" -d extracted_temp

            echo "🔎 Detecting Android project..."

            if [ -f "extracted_temp/settings.gradle.kts" ] && \
               [ -d "extracted_temp/app" ]; then

              PROJECT_ROOT="extracted_temp"

            else

              PROJECT_ROOT=$(find extracted_temp \
                -type f \
                \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
                -print -quit \
                | xargs -r dirname)

            fi

            if [ -z "$PROJECT_ROOT" ]; then
              echo "❌ Android Gradle project not found."
              find extracted_temp -maxdepth 5 -type f | head -150
              exit 1
            fi

            if [ ! -d "$PROJECT_ROOT/app" ]; then
              echo "❌ app directory not found."
              exit 1
            fi

            echo "✅ PROJECT ROOT:"
            echo "$PROJECT_ROOT"

            cp -a "$PROJECT_ROOT"/. .

            rm -rf extracted_temp

            echo "✅ ZIP extraction completed."

          else

            echo "ℹ️ No ZIP found."
            echo "Using repository files."

          fi


      # =========================================================
      # 3. VERIFY PROJECT
      # =========================================================
      - name: 🔎 Verify Android Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "🔎 VERIFYING PROJECT"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main

          echo "✅ settings.gradle.kts"
          echo "✅ build.gradle.kts"
          echo "✅ app/build.gradle.kts"
          echo "✅ app/src/main"

          echo "✅ Project verified."


      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle


      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 6. INSTALL ANDROID SDK 36
      # =========================================================
      - name: 📱 Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "✅ Android SDK ready."


      # =========================================================
      # 7. SETUP GRADLE 9.3.1
      # =========================================================
      - name: ⚙️ Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 8. PREPARE ENVIRONMENT
      # =========================================================
      - name: 🔐 Prepare Environment Files
        shell: bash
        run: |
          set -e

          if [ ! -f ".env" ]; then
            touch ".env"
          fi

          if [ ! -f ".env.example" ]; then
            touch ".env.example"
          fi

          echo "✅ Environment files ready."


      # =========================================================
      # 9. FIX ONLY TEST_NAME NULL PARSING
      # =========================================================
      - name: 🛠️ Fix test_name Null Handling
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "🛠️ FIXING test_name PARSING"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/example/data/model/Models.kt"
          )

          text = path.read_text()

          old = '@Json(name = "test_name") val testName: String = ""'

          new = '@Json(name = "test_name") val testName: String? = ""'

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("✅ TestItem.testName made nullable.")
          else:
              print("ℹ️ Expected TestItem declaration not found; leaving file unchanged.")
          PY


      # =========================================================
      # 10. FIX TEST NAME USAGE SAFELY
      # =========================================================
      - name: 🛠️ Make Existing Test Name Usage Safe
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/java/com/example/ui/screens/student/StudentHomeScreen.kt"),
              Path("app/src/main/java/com/example/ui/screens/admin/AdminHomeScreen.kt"),
          ]

          replacements = {
              "onStartTest(test.id ?: 0L, test.testName, test.duration)":
              "onStartTest(test.id ?: 0L, test.testName ?: \"Test #${test.id ?: 0L}\", test.duration)",

              "text = test.testName,":
              "text = test.testName ?: \"Test #${test.id ?: 0L}\",",

              "text = test.testName,":
              "text = test.testName ?: \"Test #${test.id ?: 0L}\",",

              "\"Are you sure you want to delete '${test.testName}'? All associated questions will also be removed.\"":
              "\"Are you sure you want to delete '${test.testName ?: \"Test #${test.id ?: 0L}\"}'? All associated questions will also be removed.\"",
          }

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              original = text

              text = text.replace(
                  "onStartTest(test.id ?: 0L, test.testName, test.duration)",
                  "onStartTest(test.id ?: 0L, test.testName ?: \"Test #${test.id ?: 0L}\", test.duration)"
              )

              text = text.replace(
                  "text = test.testName,",
                  "text = test.testName ?: \"Test #${test.id ?: 0L}\","
              )

              text = text.replace(
                  "\"Are you sure you want to delete '${test.testName}'? All associated questions will also be removed.\"",
                  "\"Are you sure you want to delete '${test.testName ?: \"Test #${test.id ?: 0L}\"}'? All associated questions will also be removed.\""
              )

              if text != original:
                  path.write_text(text)
                  print(f"✅ Updated: {path}")
              else:
                  print(f"ℹ️ No matching usage found: {path}")
          PY


      # =========================================================
      # 11. REMOVE KSP BUILD DEPENDENCIES ONLY
      # =========================================================
      - name: 🛠️ Fix KSP Build Configuration
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # Root build.gradle.kts
          root = Path("build.gradle.kts")

          if root.exists():
              text = root.read_text()

              text = text.replace(
                  'alias(libs.plugins.google.devtools.ksp) apply false',
                  ''
              )

              root.write_text(text)

          # app/build.gradle.kts
          app = Path("app/build.gradle.kts")

          text = app.read_text()

          text = text.replace(
              'alias(libs.plugins.google.devtools.ksp)',
              ''
          )

          text = text.replace(
              '  "ksp"(libs.androidx.room.compiler)\n',
              ''
          )

          text = text.replace(
              '  "ksp"(libs.moshi.kotlin.codegen)\n',
              ''
          )

          app.write_text(text)

          print("✅ KSP build dependencies removed.")
          PY


      # =========================================================
      # 12. VERIFY KSP REMOVED
      # =========================================================
      - name: 🔍 Verify KSP Configuration
        shell: bash
        run: |
          set -e

          if grep -Rni "google.devtools.ksp" \
            build.gradle.kts \
            app/build.gradle.kts; then

            echo "❌ KSP plugin still present."
            exit 1

          fi

          if grep -n '"ksp"' app/build.gradle.kts; then

            echo "❌ KSP dependencies still present."
            exit 1

          fi

          echo "✅ KSP configuration verified."


      # =========================================================
      # 13. CREATE DEBUG KEYSTORE
      # =========================================================
      - name: 🔑 Create Debug Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"

          echo "🔐 Checking debug.keystore..."

          if [ ! -f "$KEYSTORE" ]; then

            echo "⚡ Creating debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "✅ debug.keystore created."

          else

            echo "✅ debug.keystore already exists."

          fi

          ls -lh "$KEYSTORE"


      # =========================================================
      # 14. ENSURE GRADLE WRAPPER
      # =========================================================
      - name: 🛠️ Ensure Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then

            echo "⚡ Gradle wrapper not found."
            echo "➡️ Generating Gradle 9.3.1 wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1

            echo "✅ Gradle wrapper generated."

          else

            echo "✅ Gradle wrapper already exists."

          fi

          chmod +x ./gradlew

          ./gradlew --version


      # =========================================================
      # 15. CLEAN
      # =========================================================
      - name: 🧹 Clean Project
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 16. BUILD APK
      # =========================================================
      - name: 🔨 Build TEST MITRA Debug APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "🚀 BUILDING TEST MITRA APK"
          echo "========================================"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8"

          echo "========================================"
          echo "✅ APK BUILD SUCCESSFUL"
          echo "========================================"


      # =========================================================
      # 17. VERIFY APK
      # =========================================================
      - name: 🔍 Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "📦 GENERATED APK"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ APK was not generated."
            exit 1
          fi

          echo "✅ APK COUNT: $APK_COUNT"


      # =========================================================
      # 18. UPLOAD APK
      # =========================================================
      - name: 📤 Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 19. FINAL SUMMARY
      # =========================================================
      - name: 🎉 Build Summary
        shell: bash
        run: |
          echo "========================================"
          echo "🎉 TEST MITRA BUILD COMPLETED"
          echo "========================================"
          echo
          echo "Artifact: TEST-MITRA-APK"
          echo
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print
          echo
          echo "========================================"
